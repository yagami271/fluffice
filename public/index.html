<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fluffice</title>
<link rel="preload" href="vendor/font/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<div id="vignette" aria-hidden="true"></div>
<footer id="lip">
  <p id="sentence" aria-live="polite"></p>
  <p id="tally"></p>
</footer>
<ul id="roster"></ul>
<div id="tip" hidden></div>
<div id="tools">
  <div id="bar">
    <button id="toggle-demo" type="button" aria-expanded="false" data-t="demo"></button>
    <button id="toggle-sound" type="button" aria-pressed="false"></button>
  </div>
  <div id="sound" hidden>
    <label><span data-t="volume"></span> <input id="volume" type="range" min="0" max="1" step="0.05"></label>
    <button type="button" data-hear="done" data-t="hearDone"></button>
    <button type="button" data-hear="ask" data-t="hearAsk"></button>
  </div>
  <div id="demo" hidden>
    <button type="button" data-do="done" data-t="finish"></button>
    <button type="button" data-do="ask" data-t="needs"></button>
    <button type="button" data-do="reset" data-t="reset"></button>
    <button type="button" data-do="crowd" data-t="crowd"></button>
    <label><span data-t="hour"></span> <input id="hour" type="range" min="0" max="24" step="0.25"></label>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
